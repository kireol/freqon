[project]
name = "freqon"
version = "0.1.0"
description = "Network HD Radio / FM tuner service built on nrsc5"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.1",
]

[project.scripts]
freqon = "freqon.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freqon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
extend-exclude = ["src/freqon/nrsc5.py"]
